[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-financeiro-backend"
version = "0.1.0"
description = "Back-end Django REST + Arquitetura Hexagonal para o CRM Financeiro de Extensão"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<5.3",
  "djangorestframework>=3.15,<3.17",
  "drf-spectacular>=0.28,<0.30",
  "psycopg[binary]>=3.2,<3.4",
  "celery>=5.4,<5.6",
  "redis>=5.2,<6.0",
  "gunicorn>=23.0,<24.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-django>=4.9,<5.0",
  "ruff>=0.8,<0.10",
]

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["adapters/persistence/migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
